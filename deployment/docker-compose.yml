services:
  chirpstack:
    image: chirpstack/chirpstack:4
    command: -c /etc/chirpstack
    restart: unless-stopped
    container_name: chirp_stack
    volumes:
      - ./configuration/chirpstack:/etc/chirpstack
    depends_on:
      - postgres
      - mosquitto
      - redis
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - REDIS_HOST=redis
      - POSTGRESQL_HOST=postgres
    ports:
      - "8080:8080"
    networks:
      - chirpstack-core

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: unless-stopped
    container_name: chirp_gateway
    ports:
      - "1700:1700/udp"
    volumes:
      - ./configuration/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge
    environment:
      - INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      - INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      - INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/command/#
    depends_on:
      - mosquitto
    networks:
      - gateway-mqtt

  chirpstack-rest-api:
    image: chirpstack/chirpstack-rest-api:4
    restart: unless-stopped
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure
    container_name: chirp_api
    ports:
      - "8090:8090"
    depends_on:
      - chirpstack
    networks:
      - chirpstack-core

  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    container_name: chirp_postgres
    volumes:
      - ./configuration/postgresql/initdb:/docker-entrypoint-initdb.d
      - postgresqldata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=chirpstack
      - POSTGRES_PASSWORD=${REPLACE_THIS_WITH_YOUR_PASSWORD}
      - POSTGRES_DB=chirpstack
    networks:
      - chirpstack-core

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    container_name: chirp_redis
    volumes:
      - redisdata:/data
    networks:
      - chirpstack-core

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    container_name: chirp_mosquitto
    volumes:
      - ./configuration/mosquitto/config/:/mosquitto/config/
    networks:
      - chirpstack-core
      - gateway-mqtt
    ports:
      - 1883:1883

volumes:
  postgresqldata:
  redisdata:

networks:
  chirpstack-core:
    name: chirpstack-core
    driver: bridge
  gateway-mqtt:
    name: gateway-mqtt
    driver: bridge
